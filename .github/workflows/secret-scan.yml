# Secret scan: blocks new secrets from landing in this repo.
# Runs Gitleaks (open source, MIT) on the commits in each push to main/master and each pull request.
# Fails the check if a secret is found. Findings are redacted in the log.
# Managed by Second Mile Security Program, piece 2b. Do not edit per repo.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan new commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${SHA}"
          else
            RANGE="-1"
          fi
          echo "Scanning commit range: $RANGE"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git --log-opts="$RANGE" --redact --verbose --exit-code 1 /repo
